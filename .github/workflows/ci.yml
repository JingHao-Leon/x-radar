name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install chromium-headless-shell
      - name: Unit tests (offline)
        run: python -m pytest tests -q -k "not shots"
      - name: Screenshot safety tests (local chromium, no X network)
        run: python -m pytest tests -q -k "shots"
      - name: Extension syntax check
        run: |
          node --check extension/background.js
          node --check extension/content/x.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
